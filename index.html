<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>HELPCAR — Serviços Automotivos</title>
  <meta name="theme-color" content="#14532D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50:  '#F0FDF4',
              100: '#DCFCE7',
              200: '#BBF7D0',
              300: '#86EFAC',
              400: '#4ADE80',
              500: '#22C55E',
              600: '#16A34A',
              700: '#15803D',
              800: '#166534',
              900: '#14532D',
              950: '#052E16',
            },
            destaque: '#22C55E',
            'destaque-escuro': '#16A34A',
          },
          fontFamily: {
            display: ['"Bricolage Grotesque"', 'sans-serif'],
            body:    ['"Source Sans 3"', 'sans-serif'],
          },
          boxShadow: {
            'marca':   '0 4px 20px rgba(20, 83, 45, 0.12)',
            'marca-lg':'0 8px 30px rgba(20, 83, 45, 0.18)',
            'destaque':'0 4px 16px rgba(34, 197, 94, 0.25)',
            'card':    '0 2px 12px rgba(0, 0, 0, 0.06)',
          },
          borderRadius: {
            'app': '24px',
            'card': '14px',
            'btn':  '12px',
          },
          animation: {
            'fade-in': 'fadeIn .28s ease-out both',
            'slide-up': 'slideUp .32s ease-out both',
            'toast-in':  'toastIn .35s ease-out both',
            'toast-out': 'toastOut .3s ease-in both',
            'pulse-soft': 'pulseSoft 2.2s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%':   { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%':   { opacity: '0', transform: 'translateY(14px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            toastIn: {
              '0%':   { opacity: '0', transform: 'translateY(-20px) scale(0.95)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
            toastOut: {
              '0%':   { opacity: '1', transform: 'translateY(0) scale(1)' },
              '100%': { opacity: '0', transform: 'translateY(-20px) scale(0.92)' },
            },
            pulseSoft: {
              '0%, 100%': { opacity: '1' },
              '50%':      { opacity: '.7' },
            },
          },
        },
      },
    };
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Source Sans 3', system-ui, sans-serif;
      background: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    /* Phone frame */
    .phone-frame {
      width: 390px; height: 844px;
      background: #F0FDF4;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      box-shadow:
        0 0 0 3px #1E293B,
        0 0 0 7px #0F172A,
        0 30px 80px rgba(0,0,0,.45);
      display: flex; flex-direction: column;
    }
    @media (max-width: 430px) {
      .phone-frame {
        width: 100vw; height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* Status bar */
    .status-bar {
      height: 48px; padding: 14px 28px 0;
      background: #14532D;
      display: flex; justify-content: space-between; align-items: center;
      color: #F0FDF4; font-family: 'Source Sans 3', sans-serif;
      font-size: 13px; font-weight: 600; flex-shrink: 0;
      position: relative; z-index: 60;
    }
    .status-bar .time { letter-spacing: 0.3px; }
    .status-icons { display: flex; align-items: center; gap: 6px; }

    /* Screen transitions */
    [data-tela] {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      display: none;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    [data-tela]:not(.hidden) {
      display: block;
      animation: fadeIn .28s ease-out both, slideUp .32s ease-out both;
    }

    /* Bottom nav */
    .bottom-nav {
      display: flex; justify-content: space-around; align-items: center;
      height: 72px; background: #FFFFFF;
      border-top: 1px solid rgba(20,83,45,0.08);
      padding-bottom: env(safe-area-inset-bottom, 0);
      flex-shrink: 0; position: relative; z-index: 50;
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px; height: 100%; cursor: pointer;
      color: #94A3B8; transition: color .2s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none; background: none; border: none;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 10px; font-weight: 600;
    }
    .nav-btn svg { transition: transform .2s ease; }
    .nav-btn.ativo {
      color: #14532D;
    }
    .nav-btn.ativo svg { transform: scale(1.08); }
    .nav-btn::before {
      content: ''; position: absolute; top: 0; left: 50%;
      transform: translateX(-50%) scaleX(0); width: 32px; height: 3px;
      background: #22C55E; border-radius: 0 0 3px 3px;
      transition: transform .25s ease;
    }
    .nav-btn.ativo::before { transform: translateX(-50%) scaleX(1); }

    /* Scrollbar */
    [data-tela]::-webkit-scrollbar { width: 3px; }
    [data-tela]::-webkit-scrollbar-track { background: transparent; }
    [data-tela]::-webkit-scrollbar-thumb {
      background: rgba(20,83,45,0.15); border-radius: 3px;
    }

    /* Focus */
    :focus-visible {
      outline: 2px solid #22C55E;
      outline-offset: 2px;
      border-radius: 6px;
    }

    /* Reusable components */
    .badge {
      display: inline-flex; align-items: center;
      padding: 2px 10px; border-radius: 9999px;
      font-size: 12px; font-weight: 600;
      line-height: 1.6; white-space: nowrap;
    }
    .badge-verde   { background: #DCFCE7; color: #14532D; }
    .badge-amarelo { background: #FEF9C3; color: #713F12; }
    .badge-vermelho{ background: #FEE2E2; color: #7F1D1D; }
    .badge-cinza   { background: #F1F5F9; color: #475569; }
    .badge-azul    { background: #DBEAFE; color: #1E3A8A; }

    .card {
      background: #FFFFFF; border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .card-interativo {
      cursor: pointer;
    }
    .card-interativo:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,.1);
    }
    .card-interativo:active {
      transform: scale(0.985);
      transition: transform .1s ease;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; padding: 12px 24px; border-radius: 12px;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 15px; font-weight: 700;
      cursor: pointer; border: none; text-decoration: none;
      transition: transform .15s ease, box-shadow .2s ease, opacity .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primario {
      background: #22C55E; color: #052E16;
      box-shadow: 0 4px 16px rgba(34,197,94,.3);
    }
    .btn-primario:hover { background: #16A34A; }
    .btn-secundario {
      background: #F0FDF4; color: #14532D;
      border: 1.5px solid #BBF7D0;
    }
    .btn-secundario:hover { background: #DCFCE7; }
    .btn-perigo {
      background: #FEE2E2; color: #991B1B;
    }
    .btn-ghost {
      background: transparent; color: #14532D;
      padding: 8px 16px;
    }
    .btn-ghost:hover { background: #F0FDF4; }
    .btn:disabled {
      opacity: .5; cursor: not-allowed;
      pointer-events: none;
    }

    /* Toast */
    #toast-container {
      position: fixed; top: 16px; left: 50%;
      transform: translateX(-50%); z-index: 9999;
      display: flex; flex-direction: column; gap: 8px;
      width: calc(100% - 32px); max-width: 350px;
      pointer-events: none;
    }
    .toast {
      padding: 14px 18px; border-radius: 12px;
      display: flex; align-items: center; gap: 10px;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 14px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,.15);
      pointer-events: auto;
    }
    .toast-ok      { background: #14532D; color: #F0FDF4; }
    .toast-erro    { background: #991B1B; color: #FFF1F2; }
    .toast-info    { background: #FFFFFF; color: #14532D; border: 1px solid #BBF7D0; }
    .toast.saindo  { animation: toastOut .3s ease-in forwards; }

    /* Modal */
    #modal-overlay {
      position: fixed; inset: 0; z-index: 8000;
      background: rgba(5, 46, 22, 0.55);
      display: none; align-items: flex-end; justify-content: center;
      backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    }
    #modal-overlay.aberto { display: flex; }
    @media (min-width: 431px) {
      #modal-overlay { align-items: center; }
    }
    #modal-cartao {
      background: #FFFFFF; width: 100%; max-width: 390px;
      border-radius: 24px 24px 0 0;
      max-height: 80%; overflow-y: auto;
      animation: slideUp .3s ease-out both;
    }
    @media (min-width: 431px) {
      #modal-cartao {
        border-radius: 20px; max-height: 75%;
        animation: fadeIn .25s ease-out both;
      }
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px 12px; border-bottom: 1px solid #F1F5F9;
      position: sticky; top: 0; background: #FFFFFF; z-index: 1;
    }
    .modal-body { padding: 16px 24px 24px; }
    .modal-fechar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border: none; background: #F1F5F9;
      color: #475569; transition: background .15s;
    }
    .modal-fechar:hover { background: #E2E8F0; }

    /* Section titles */
    .section-title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 700; color: #14532D;
      font-size: 18px; line-height: 1.3;
    }
    .section-subtitle {
      font-size: 14px; color: #64748B;
      margin-top: 2px;
    }

    /* Input */
    .input-marca {
      width: 100%; padding: 12px 16px;
      border: 1.5px solid #E2E8F0; border-radius: 12px;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 15px; color: #14532D;
      background: #FFFFFF;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    .input-marca:focus {
      border-color: #22C55E;
      box-shadow: 0 0 0 3px rgba(34,197,94,.15);
    }
    .input-marca::placeholder { color: #94A3B8; }

    /* Avatar */
    .avatar {
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 700; color: #FFFFFF;
      flex-shrink: 0;
    }

    /* Screen header area */
    .screen-header {
      padding: 16px 20px 0;
    }
    .screen-body {
      padding: 12px 20px 100px;
    }

    /* Ripple touch */
    @media (hover: none) {
      .btn:active { opacity: .85; }
    }
  </style>
</head>

  <script>
    // ── Status bar clock ──
    (function atualizarRelogio() {
      var agora = new Date();
      var h = String(agora.getHours()).padStart(2, '0');
      var m = String(agora.getMinutes()).padStart(2, '0');
      var el = document.getElementById('status-time');
      if (el) el.textContent = h + ':' + m;
    })();

    // ── Toast system ──
    function toast(mensagem, tipo) {
      var container = document.getElementById('toast-container');
      var el = document.createElement('div');
      el.className = 'toast toast-' + (tipo || 'info') + ' animate-toast-in';

      var icone = '';
      if (tipo === 'ok') {
        icone = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
      } else if (tipo === 'erro') {
        icone = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
      } else {
        icone = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
      }
      el.innerHTML = icone + '<span>' + mensagem + '</span>';
      el.style.animation = 'toastIn .35s ease-out both';
      container.appendChild(el);

      setTimeout(function () {
        el.classList.add('saindo');
        el.addEventListener('animationend', function () { el.remove(); });
      }, 3000);
    }

    // ── Modal system ──
    function abrirModal(html, titulo) {
      var overlay = document.getElementById('modal-overlay');
      document.getElementById('modal-titulo').textContent = titulo || '';
      document.getElementById('modal-corpo').innerHTML = html;
      overlay.classList.add('aberto');
      document.body.style.overflow = 'hidden';
    }

    function fecharModal() {
      document.getElementById('modal-overlay').classList.remove('aberto');
      document.body.style.overflow = '';
    }

    document.getElementById('modal-overlay').addEventListener('click', function (e) {
      if (e.target === this) fecharModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') fecharModal();
    });

    // ── Formatters ──
    function brl(valor) {
      return new Intl.NumberFormat('pt-BR', {
        style: 'currency', currency: 'BRL'
      }).format(valor);
    }

    function dataBR(iso) {
      if (!iso) return '—';
      var d = new Date(iso + 'T03:00:00');
      var dd = String(d.getDate()).padStart(2, '0');
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      var aa = d.getFullYear();
      return dd + '/' + mm + '/' + aa;
    }

    // ── Helpers ──
    var CORES_AVATAR = ['#14532D','#15803D','#166534','#22C55E','#16A34A','#0F766E','#1E40AF','#7C3AED'];
    function avatarCor(nome) {
      var h = 0;
      for (var i = 0; i < nome.length; i++) h = (h * 31 + nome.charCodeAt(i)) | 0;
      return CORES_AVATAR[Math.abs(h) % CORES_AVATAR.length];
    }
    function iniciais(nome) {
      var p = nome.trim().split(/\s+/);
      return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
    }

    // ── Router ──
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0 });
    }

    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('painel-principal');
    });
  </script>
</body>
</html>
